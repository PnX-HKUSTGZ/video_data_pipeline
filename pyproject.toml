[project]
name = "video-dataset-pipeline"
version = "0.1.0"
description = "Reproducible video pseudo-labeling for YOLO detection datasets"
requires-python = ">=3.12,<3.13"
dependencies = [
  "av>=14,<17",
  "ultralytics>=8.4.173,<9",
  "torch==2.7.1",
  "torchvision==0.22.1",
  "PyYAML>=6,<7",
  "albumentations==2.0.8",
  "opencv-python>=4.12,<5",
  "opencv-python-headless>=4.12,<5",
  "numpy>=2,<2.3",
]

[project.scripts]
video-dataset = "video_dataset_pipeline.cli:main"
yolo-viewer = "yolo_dataset_viewer.cli:main"

[project.optional-dependencies]
viewer = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "Pillow>=11,<13"]

[tool.hatch.build.targets.wheel]
packages = ["src/video_dataset_pipeline", "src/yolo_dataset_viewer"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "ruff>=0.12",
    "types-pyyaml>=6.0.12.20260906",
    "httpx>=0.28,<1",
]
browser = ["playwright>=1.58,<1.59"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
files = ["src/video_dataset_pipeline", "src/yolo_dataset_viewer"]
strict = true
disallow_any_explicit = true

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
