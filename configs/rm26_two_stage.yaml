# 同一个 CLI 使用 pipeline 选择推理实现；相对路径基于当前工作目录。
pipeline: two_stage
input: datasets/rm26_fps_videos/videos/北部赛区/红方/recvlnoyv3arV6_红方工程第一视角.flv
output: datasets/generated/rm26_two_stage/recvlnoyv3arV6_test
model: models/hkust/detector/best.pt
model_yaml: models/hkust/detector/metadata.yaml
sample_fps: 2.0
confidence: 0.5
iou: 0.7
imgsz: 640
batch_size: 8
device: 5
save_video: false
train_fraction: 0.8
split_gap_seconds: 5.0
output_keypoints: [TL, TR, BL, BR, ring, light_BR, light_TR, shell_R, shell_M, shell_L, light_TL, light_BL]
keypoint_models:
  0:
    config: models/hkust/marker/inference.py
    checkpoint: models/hkust/marker/checkpoint.pth
    output_indices: [0, 1, 2, 3, 4]
    confidence: 0.1
    in_frame_confidence: null
    crop_margin: 0.0
    batch_size: 1
  1:
    config: models/hkust/station/inference.py
    checkpoint: models/hkust/station/checkpoint.pth
    output_indices: [5, 6, 7, 8, 9, 10, 11]
    confidence: 0.1
    in_frame_confidence: null
    crop_margin: 0.0
    batch_size: 1
