[project]
name = "video-dataset-pipeline"
version = "0.1.0"
description = "Reproducible video pseudo-labeling for YOLO detection datasets"
requires-python = ">=3.12,<3.13"
dependencies = [
  "av>=14,<17",
  "ultralytics>=8.4.173,<9",
  "torch==2.7.1",
  "torchvision==0.22.1",
  "PyYAML>=6,<7",
  "albumentations==2.0.8",
  "opencv-python>=4.12,<5",
  "opencv-python-headless>=4.12,<5",
  "numpy>=2,<2.3",
  "mmpose==1.3.2",
  "mmengine==0.10.7",
  "mmcv==2.1.0",
  "mmdet==3.2.0",
  "xtcocotools==1.14.3",
  "pip>=24",
  "setuptools>=69,<81",
  "wheel>=0.43",
  "Cython>=3,<4",
  "ninja>=1.11",
]

[project.scripts]
video-dataset = "video_dataset_pipeline.cli:main"
yolo-viewer = "yolo_dataset_viewer.cli:main"
vlm-correct = "vlm_correct_pipeline.cli:main"

[project.optional-dependencies]
viewer = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "Pillow>=11,<13"]
vlm = ["openai>=2,<3", "python-dotenv>=1,<2", "pydantic>=2,<3", "Pillow>=11,<13"]

[tool.hatch.build.targets.wheel]
packages = ["src/video_dataset_pipeline", "src/yolo_dataset_viewer", "src/vlm_correct_pipeline"]

[tool.hatch.build]
exclude = [
  "src/vlm_correct_pipeline/.env",
  "src/vlm_correct_pipeline/.checks/**",
  "src/vlm_correct_pipeline/config.local.yaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "ruff>=0.12",
    "types-pyyaml>=6.0.12.20260906",
    "httpx>=0.28,<1",
]
browser = ["playwright>=1.58,<1.59"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
no-build-isolation-package = ["mmcv", "chumpy", "xtcocotools"]
no-binary-package = ["mmcv", "xtcocotools"]

[[tool.uv.dependency-metadata]]
name = "chumpy"
version = "0.70"
requires-dist = ["scipy>=0.13.0", "six>=1.11.0"]

[[tool.uv.dependency-metadata]]
name = "mmcv"
version = "2.1.0"
requires-dist = ["addict", "mmengine>=0.3.0", "numpy", "packaging", "Pillow", "pyyaml", "yapf"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
files = ["src/video_dataset_pipeline", "src/yolo_dataset_viewer", "src/vlm_correct_pipeline"]
strict = true
disallow_any_explicit = true

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
